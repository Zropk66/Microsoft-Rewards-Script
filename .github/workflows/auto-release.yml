name: Release and Docker Push

on:
    push:
        tags:
            - 'v*'
        branches:
            - 'v4'
    workflow_dispatch:
        inputs:
            force:
                description: 'Force build and push even if image tag exists'
                required: false
                type: boolean
                default: false

permissions:
    contents: write
    packages: write

env:
    REGISTRY: ghcr.io

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Normalize image name (lowercase)
              id: image
              run: |
                  set -euo pipefail
                  IMG="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
                  echo "name=$IMG" >> "$GITHUB_OUTPUT"
                  echo "LOG: Image: ${{ env.REGISTRY }}/$IMG"

            - name: Read version and tag
              id: version
              run: |
                  set -euo pipefail
                  if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                      TAG_NAME="${GITHUB_REF_NAME}"
                      VER="${TAG_NAME#v}"
                  else
                      VER="$(node -p "require('./package.json').version")"
                      TAG_NAME="v${VER}"
                  fi
                  echo "version=$VER" >> "$GITHUB_OUTPUT"
                  echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
                  echo "LOG: Version: $VER, Tag: $TAG_NAME"

            - name: Check if GitHub Release already exists
              id: relcheck
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  TAG="${{ steps.version.outputs.tag }}"
                  echo "LOG: Checking GitHub Release for tag: $TAG"

                  set +e
                  gh release view "$TAG" >/dev/null 2>&1
                  CODE=$?
                  set -e

                  if [ "$CODE" -eq 0 ]; then
                      echo "LOG: Release exists for $TAG"
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "LOG: Release does not exist for $TAG"
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create GitHub Release
              if: steps.relcheck.outputs.exists != 'true'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.version.outputs.tag }}
                  target_commitish: ${{ github.sha }}
                  name: ${{ steps.version.outputs.tag }}
                  generate_release_notes: true

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Check if Docker image tag already exists
              id: imgcheck
              run: |
                  set -euo pipefail
                  if [ "${{ github.event.inputs.force }}" = "true" ] || [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                      echo "LOG: Force push or tag push. Skipping existence check."
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}"
                  TAG="${{ steps.version.outputs.version }}"
                  REF="$IMAGE:$TAG"

                  echo "LOG: Checking image manifest: $REF"

                  set +e
                  docker manifest inspect "$REF" >/dev/null 2>&1
                  CODE=$?
                  set -e

                  if [ "$CODE" -eq 0 ]; then
                      echo "LOG: Image tag exists: $REF"
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "LOG: Image tag does not exist: $REF"
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Stop if Docker image already exists
              if: steps.imgcheck.outputs.exists == 'true'
              run: |
                  echo "LOG: Docker image already exists for version ${{ steps.version.outputs.version }}. Nothing to do."
                  exit 0

            - name: Compute image tags
              if: steps.imgcheck.outputs.exists != 'true'
              id: tags
              run: |
                  set -euo pipefail
                  IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}"
                  VER="${{ steps.version.outputs.version }}"
                  TAG="${{ steps.version.outputs.tag }}"
                  MAJOR="${VER%%.*}"

                  TAGS="$IMAGE:$VER"$'\n'"$IMAGE:$TAG"$'\n'"$IMAGE:$MAJOR"$'\n'"$IMAGE:latest"

                  { echo "list<<EOF"; echo "$TAGS"; echo "EOF"; } >> "$GITHUB_OUTPUT"
                  echo "LOG: Tags:"
                  echo "$TAGS"

            - name: Set up QEMU
              if: steps.imgcheck.outputs.exists != 'true'
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              if: steps.imgcheck.outputs.exists != 'true'
              uses: docker/setup-buildx-action@v3

            - name: Build and push Docker image
              if: steps.imgcheck.outputs.exists != 'true'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ steps.tags.outputs.list }}
                  cache-from: type=gha,scope=${{ github.ref_name }}
                  cache-to: type=gha,scope=${{ github.ref_name }},mode=max
